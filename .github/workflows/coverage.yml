name: Code Coverage

on:
  push:
    branches:
      - main
      - feat/*
  pull_request:
    branches:
      - main
      - feat/*
    paths-ignore:
      - "docs/**"
      - "**.md"
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # micromamba activation
    shell: bash -l -eo pipefail {0}

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Disk Space Before Clean Up
        run: |
          df -h
      - name: Free Disk Space (Base Runner)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false
          docker-images: false
      - name: Disk Space After Clean Up
        run: |
          df -h
      - name: Checkout mamba repository
        uses: actions/checkout@v7
      - name: Create build environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: ./dev/environment-dev.yml
          environment-name: build_env
          # Most verbose micromamba logs to debug sporadic
          # "Cannot find a valid extracted directory cache" failures
          # after environment cache restore.
          log-level: trace
          cache-environment: true
          cache-environment-key: >-
            coverage-${{
              hashFiles(
                'dev/environment-dev.yml',
                'dev/environment-dev-extra.yml',
                'dev/environment-micromamba-static.yml'
              )
            }}-${{ github.event.pull_request.number || github.ref }}
      - name: Dump package cache after environment restore
        run: |
          echo '::group::Package cache after environment restore'
          echo "MAMBA_ROOT_PREFIX=${MAMBA_ROOT_PREFIX}"
          micromamba --log-level=trace info -n build_env || true
          pkgs="${MAMBA_ROOT_PREFIX}/pkgs"
          if [[ -d "${pkgs}" ]]; then
            echo "Package cache exists: ${pkgs}"
            echo "Top-level entries: $(find "${pkgs}" -mindepth 1 -maxdepth 1 | wc -l)"
            echo "pygments-related paths:"
            find "${pkgs}" -iname '*pygments*' -print 2>/dev/null || echo "(none)"
          else
            echo "Package cache directory does not exist: ${pkgs}"
          fi
          echo "Installed pygments metadata:"
          ls -la "${MAMBA_ROOT_PREFIX}/envs/build_env/conda-meta/"*pygments* 2>/dev/null || echo "(none)"
          df -h
          echo '::endgroup::'
      - name: Install dev-extra environment
        run: |
          micromamba install -n build_env -y -vvv --log-level=trace \
            -f ./dev/environment-dev-extra.yml
          echo '::group::Package cache after dev-extra install'
          pkgs="${MAMBA_ROOT_PREFIX}/pkgs"
          echo "Top-level pkgs entries: $(find "${pkgs}" -mindepth 1 -maxdepth 1 | wc -l)"
          echo "pygments-related paths:"
          find "${pkgs}" -iname '*pygments*' -print 2>/dev/null || echo "(none)"
          echo '::endgroup::'
      - name: Install micromamba-static environment
        run: |
          dump_pygments_cache() {
            echo '::group::Package cache dump (pygments / pkgs)'
            pkgs="${MAMBA_ROOT_PREFIX}/pkgs"
            echo "Package cache: ${pkgs}"
            if [[ -d "${pkgs}" ]]; then
              echo "Top-level pkgs entries: $(find "${pkgs}" -mindepth 1 -maxdepth 1 | wc -l)"
              echo "pygments-related paths:"
              find "${pkgs}" -iname '*pygments*' -ls 2>/dev/null || echo "(none)"
              echo "Extracted pygments directories:"
              find "${pkgs}" -type d -iname 'pygments-*' -print 2>/dev/null || echo "(none)"
              echo "pygments tarballs:"
              find "${pkgs}" -type f \( -iname 'pygments-*.conda' -o -iname 'pygments-*.tar.bz2' \) -ls 2>/dev/null || echo "(none)"
            else
              echo "Package cache directory does not exist"
            fi
            echo "Installed pygments metadata:"
            ls -la "${MAMBA_ROOT_PREFIX}/envs/build_env/conda-meta/"*pygments* 2>/dev/null || echo "(none)"
            df -h
            echo '::endgroup::'
          }
          dump_pygments_cache
          micromamba install -n build_env -y -vvv --log-level=trace \
            -f ./dev/environment-micromamba-static.yml \
            || { dump_pygments_cache; exit 1; }
      - uses: hendrikmuhs/ccache-action@main
        with:
          variant: sccache
          key: ${{ github.job }}-${{ github.runner.os }}
          restore-keys: |
            ccache-libmamba-${{ github.runner.os }}
      - name: Build mamba with coverage
        run: |
          cmake -B build/ -G Ninja \
            --preset mamba-unix-shared-debug \
            -D CMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -D CMAKE_C_COMPILER_LAUNCHER=sccache \
            -D MAMBA_WARNING_AS_ERROR=ON \
            -D BUILD_LIBMAMBA_SPDLOG=ON \
            -D BUILD_LIBMAMBAPY=ON \
            -D BUILD_MICROMAMBA=ON \
            -D ENABLE_MAMBA_ROOT_PREFIX_FALLBACK=OFF \
            -D CMAKE_BUILD_TYPE=Debug \
            -D CMAKE_CXX_FLAGS_DEBUG="-g -O0 -fno-omit-frame-pointer --coverage -fprofile-update=atomic" \
            -D CMAKE_C_FLAGS_DEBUG="-g -O0 -fno-omit-frame-pointer --coverage -fprofile-update=atomic"
          cmake --build build/ --parallel
      - name: Show build cache statistics
        run: sccache --show-stats
      - name: Run C++ tests with coverage
        continue-on-error: true
        run: |
          unset CONDARC  # Interferes with tests
          ./build/libmamba/ext/solv-cpp/tests/test_solv_cpp
          ./build/libmamba/tests/test_libmamba
      - name: Install lcov
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov
      - name: Generate C++ coverage report
        run: |
          lcov --directory . --capture --output-file cpp_coverage.info
          lcov --remove cpp_coverage.info '/usr/*' '*/tests/*' '*/build/*' 'libmamba/tests/*' --output-file cpp_coverage.info --ignore-errors unused
          lcov --summary cpp_coverage.info --ignore-errors mismatch --rc geninfo_unexecuted_blocks=1

      # TODO: Those steps need adaptations so that the coverage reports from the C++ and the python test suites are consolidated.
      # - name: Install libmambapy
      #   run: |
      #     cmake --install build/ --prefix "${CONDA_PREFIX}"
      #     python -m pip install --no-deps --no-build-isolation ./libmambapy
      # - name: Run Python tests with coverage
      #   continue-on-error: true
      #   run: |
      #     # Run libmambapy tests with coverage
      #     python -m pytest libmambapy/tests/ --cov=libmambapy --cov-report=xml --cov-report=term-missing
      #     # Run micromamba tests with coverage
      #     export TEST_MAMBA_EXE=$(pwd)/build/micromamba/mamba
      #     python -m pytest micromamba/tests/ --cov=micromamba --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: |
            ./cpp_coverage.info
            ./coverage.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
